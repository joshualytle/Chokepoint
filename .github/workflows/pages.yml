name: Deploy web-native app to GitHub Pages

# Builds the Pyodide bundle (web/chokepoint.zip) from the Python core and
# publishes the static web/ folder to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

# Manual only: this does nothing until you opt in. To publish the web-native app,
# first enable Pages (Settings -> Pages -> Source: GitHub Actions), then run this
# workflow from the Actions tab (or flip the commented trigger below back on).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["web/**", "src/chokepoint/**", "serve_native.py", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Package the Python core for Pyodide
        run: python -c "import serve_native; serve_native.build_package()"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
