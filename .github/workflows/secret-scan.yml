# Secret scanning in CI: the net under the pre-commit hook.
#
# The hook can be bypassed (--no-verify) or simply not installed in a fresh
# clone. This runs regardless, on every PR, and is the gate that cannot be
# skipped locally.
#
# Least privilege: contents:read is all a scan needs. The action is pinned to a
# commit SHA, not a tag -- see SEC-007; a tag is mutable by whoever controls
# the namespace, and this job runs with repository context.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main, master, dev]

permissions:
  contents: read
  # The action lists the PR's commits to scan only what the PR adds, which
  # needs pull-requests:read. Granting only contents:read failed the first
  # real run with "Resource not accessible by integration" (403). Least
  # privilege has to be SUFFICIENT privilege -- a permission set so tight the
  # job cannot run is an outage, not a control.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: a secret introduced three commits ago and reverted in
          # the next one is still in the pack, still clonable, still leaked.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v8.18.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO ARTIFACT UPLOAD, for two independent reasons.
          #
          # It broke the gate on arrival. The first real run of this workflow in
          # the grandmediastation org logged "no leaks found" and then FAILED
          # anyway: "Failed to CreateArtifact: Artifact storage quota has been
          # hit". A security gate that goes red for a billing reason unrelated
          # to security is a gate people learn to ignore, which costs more than
          # the gate was ever worth.
          #
          # And a secret scanner's report is the wrong thing to retain. The
          # artifact is a list of where credentials are, stored with different
          # access rules and lifetime from the repo itself. The findings belong
          # in the job log, already scoped to whoever can read the repo.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
